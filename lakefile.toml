name = "cborg"
version = "0.2.0"
description = "CBOR library for Lean, a port of the Haskell cborg library"
keywords = ["cbor", "serialization", "codec"]
license = "GPL-3.0-or-later"
defaultTargets = ["Cborg"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Cborg"

[[lean_exe]]
name = "Cborg.Tests.Reference"
root = "Cborg.Tests.Reference"

[[lean_exe]]
name = "Cborg.Tests.Encoding"
root = "Cborg.Tests.Encoding"

[[lean_exe]]
name = "Cborg.Tests.Properties"
root = "Cborg.Tests.Properties"

[[lean_exe]]
name = "Cborg.Tests.ThinClient"
root = "Cborg.Tests.ThinClient"

[[lean_exe]]
name = "Cborg.Tests.Corpus"
root = "Cborg.Tests.Corpus"
